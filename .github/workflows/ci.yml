name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2.1.1
    permissions:
      contents: write
      pull-requests: write
    with:
      version-file: '.tool-versions'
      enable-ct: true
      enable-ex-doc: false
      enable-hank: true
      # rebar3_audit currently crashes on git deps (gakudan family is git-pinned).
      enable-audit: false
      enable-coverage: true
      enable-elp-lint: true
      enable-elp-eqwalize: false
      enable-sbom: true
      enable-sbom-scan: true
      enable-dependency-submission: true
      enable-summary: true
